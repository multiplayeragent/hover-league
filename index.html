 *   HUD & RESULTS . position, laps, speed, countdown, results, leaderboard
 *   INPUT ......... keyboard and touch

 *     once a second, and `n`/`c` (name, color) once.

 *     worked out every frame. Only the host writes the shared fields `race` (id, version

 *   - Intent: "again" {} from the results card asks the host to start the next race now.
 *   - Other craft are drawn a little ahead of their last update (speed × time since), then
 *     eased, so they glide instead of stepping 15 times a second.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).

// ── WORLD ───────────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });

const camera = new THREE.PerspectiveCamera(70, 1, 0.5, 2400);

const sun = new THREE.DirectionalLight("#ffd6f0", 1.4); sun.position.set(-60, 120, 80); scene.add(sun);

  // The slide catches up with the nose; the road curving under you turns both.
  me.m += angle(me.a - me.m) * Math.min(1, CONFIG.grip * (brake ? 0.7 : 1) * dt);
  const k = curv(me.f), ds = (me.v * Math.cos(me.m) * dt) / clamp(1 - k * me.u, 0.6, 1.6);
  me.f = wrapF(me.f + ds / SEG); me.d += ds; me.u += me.v * Math.sin(me.m) * dt; me.cv = ds / Math.max(dt, 1e-4);
  me.a = angle(me.a - k * ds); me.m = angle(me.m - k * ds);
  // The rails: bounce off, lose speed, turn the nose back along the wall.
  if (Math.abs(me.u) > EDGE) {
    const side = Math.sign(me.u), into = Math.sin(me.m) * side;
    me.u = side * EDGE;
    if (into > 0) {
      me.v *= 1 - CONFIG.wallLoss * into;
      if (Math.abs(me.m) < Math.PI / 2) me.m = -me.m * 0.25;
      me.a -= side * into * 0.6;
      if (into > 0.1 && now > me.wallCd) {
        me.wallCd = now + 250; me.shake = Math.min(1, into * 2);
        worldAt(me.f, me.u + side * 1.2, 0.8, _w); emit(_w, _f.set(0, 3, 0), side > 0 ? "#3df5ff" : "#ff3df0", 24, 14, 0.5); beep(110, 0.15, "square", 0.08);
      }
    }
    me.v *= 1 - 0.5 * dt; // scraping
  }
  // Other craft: slide apart sideways.
  for (const v of views.values()) {
    const sd = dIdx(me.f, v.f) * SEG, du = me.u - v.u;
    if (Math.abs(sd) > 3.4 || Math.abs(du) > 2.9) continue;
    me.u = clamp(me.u + (Math.sign(du) || 1) * (2.9 - Math.abs(du)) * 0.6, -EDGE, EDGE); me.v *= 0.99;
    if (now > me.bumpCd) { me.bumpCd = now + 400; me.shake = 0.4; beep(180, 0.08, "triangle", 0.08); }
  }
  // Boost pads
  const onPad = racing && !!padAt(me.f, me.u);
  if (onPad && !me.onPad) { beep(300, 0.35, "sawtooth", 0.06, 1200); toast("BOOST!", 600); worldAt(me.f, me.u, 0.5, _w); emit(_w, _f.set(0, 4, 0), "#7ff9ff", 30, 10, 0.6); }
  if (onPad) me.boost = CONFIG.boostTime;
  me.onPad = onPad;
  if (racing) {
    const lap = Math.floor(me.d / TLEN);
    if (lap > me.lap) {
      me.lap = lap;
      const lapMs = Date.now() - me.lapStart; me.lapStart = Date.now();
      if (!me.best || lapMs < me.best) me.best = lapMs;
      if (me.lap >= CONFIG.laps) { me.ft = Date.now() - r.startAt; beep(660, 0.15); setTimeout(() => beep(880, 0.15), 140); setTimeout(() => beep(1320, 0.35), 280); toast(`Finished ${ord(racers().findIndex((x) => x.mine) + 1)}!`, 2500); }
      else { beep(660, 0.12); setTimeout(() => beep(990, 0.18), 120); toast(me.lap === CONFIG.laps - 1 ? "Final lap!" : `Lap ${me.lap + 1}`, 1300); }
    }
  }
  if (now - me.lastSend > 66) {
    me.lastSend = now;
    net.me.set("k", JSON.stringify({ r: me.raceId, f: +me.f.toFixed(1), u: +me.u.toFixed(2), a: +me.a.toFixed(2), v: Math.round(me.cv), d: +me.d.toFixed(1), ft: me.ft, b: me.boost > 0 ? 1 : 0, s: +me.lean.toFixed(1) }));
  }
}

/** ?attract: your craft flies itself, taking the inside line and the pads like a bot. */
function autopilot() {
  const kA = curv(me.f + 28 / SEG), pad = padAhead(me.f, 50);
  const want = pad ? pad.u : clamp(kA * 220, -1, 1) * (half - 3.5);
  const aim = clamp((want - me.u) * 0.05, -0.35, 0.35);
  input.axis = clamp((aim - me.a) * 5, -1, 1);
  input.brake = Math.abs(kA) > 0.03;
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const ord = (n) => n + (n % 10 === 1 && n % 100 !== 11 ? "st" : n % 10 === 2 && n % 100 !== 12 ? "nd" : n % 10 === 3 && n % 100 !== 13 ? "rd" : "th");
const fmt = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor((ms % 60000) / 1000)).padStart(2, "0")}.${String(Math.floor(ms % 1000)).padStart(3, "0")}`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let toastTimer = 0;
function toast(text, ms = 1500) { if (ATTRACT) return; const m = $("msg"); m.textContent = text; m.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => m.classList.remove("on"), ms); }
let board = null, boardFor = -1, lastCount = "", started = 0;
function hud(r, now) {
  const t = Date.now();
  const count = r.phase === "grid" && r.startAt - t < 3000 ? String(Math.max(1, Math.ceil((r.startAt - t) / 1000))) : r.phase === "race" && t - r.startAt < 900 ? "GO!" : "";
  if (count !== lastCount) { lastCount = count; if (count === "GO!") beep(880, 0.4, "square", 0.08); else if (count) beep(440, 0.15, "square", 0.08); }
  $("count").textContent = count;
  if (ATTRACT) { for (const id of ["pos", "lap", "speed", "net", "hint"]) $(id).textContent = ""; return; }
  const order = racers(), at = order.findIndex((x) => x.mine) + 1;
  $("pos").innerHTML = at ? `${ord(at)} <small>/ ${order.length}</small>` : "";
  $("lap").textContent = me.ft ? `Finished · ${fmt(me.ft)}` : `Lap ${clamp(me.lap + 1, 1, CONFIG.laps)}/${CONFIG.laps}${me.best ? ` · best ${fmt(me.best)}` : ""}`;
  $("speed").innerHTML = `${Math.round(me.v * 5)} <small>km/h</small><div id="boostbar"><i style="width:${Math.round((me.boost / CONFIG.boostTime) * 100)}%"></i></div>`;
  $("hint").textContent = r.phase === "grid" && r.startAt - t >= 3000 ? "Next race starting…" : me.ft && r.phase === "race" ? "Waiting for the others…" :
    now - started < 14000 ? (touchUI ? "◀ ▶ to steer · hold BRAKE to turn tighter · fly over the arrows" : "←/→ to steer · Shift or ↓ to air-brake · fly over the arrows") : "";
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the race" : ""}`;
  $("over").hidden = r.phase !== "done";
  if (r.phase === "done") {
    $("results").innerHTML = r.results.map((x) => `<li class="${x.id === net.sessionId ? "me" : ""}">${esc(x.n)}<span>${x.ft ? fmt(x.ft) : "DNF"}</span></li>`).join("");
    $("next").textContent = `Next race in ${Math.max(0, Math.ceil((r.endsAt - t) / 1000))}s`;
    if (boardFor !== r.id) { boardFor = r.id; showBoard(); }
  }
}
function showBoard() {
  const list = $("board");
  if (!board) { list.innerHTML = "<li class=\"note\">Leaderboards need a connection.</li>"; return; }
  const submit = me.best && me.submitted !== me.raceId ? board.submit(Math.max(0, 600000 - me.best)).catch(() => null) : Promise.resolve();
  me.submitted = me.raceId;
  submit.then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${fmt(600000 - e.score)}</span></li>`).join("") : "<li class=\"note\">No laps yet. Set the first.</li>";
  }).catch(() => { list.innerHTML = "<li class=\"note\">Couldn't load the leaderboard.</li>"; });
}
function again() { const r = race(); if (r && r.phase === "done" && isHost()) newRace(r.id + 1); }
$("again").onclick = () => { if (isHost()) again(); else net.send("again", {}); };

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
$("padL").hidden = $("padR").hidden = !touchUI;
document.body.classList.toggle("touch", touchUI);
const wakeAudio = () => { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } };
const KEYS = { ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right", ArrowDown: "brake", s: "brake", S: "brake", Shift: "brake", " ": "brake" };
addEventListener("keydown", (e) => { wakeAudio(); const k = KEYS[e.key]; if (k) { e.preventDefault(); input[k] = true; } });
addEventListener("keyup", (e) => { const k = KEYS[e.key]; if (k) input[k] = false; });
for (const b of document.querySelectorAll(".pad button")) {
  const k = b.dataset.k, on = (v) => { input[k] = v; b.classList.toggle("on", v); };
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); wakeAudio(); b.setPointerCapture(e.pointerId); on(true); });
  for (const ev of ["pointerup", "pointercancel"]) b.addEventListener(ev, () => on(false));
}
renderer.domElement.addEventListener("pointerdown", wakeAudio);
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0, camA = 0;
const camUp = new THREE.Vector3(0, 1, 0), camLook = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.wasHost = false; host.last = null; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the race meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const r = race(), tSec = now / 1000;
  if (r) myTick(dt, r, now);
  // everyone else's craft
  const seen = new Set(), live = new Set(livePlayers()); // a closed tab can linger in state for a while: skip it
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    if (id === net.sessionId || !live.has(id)) continue;
    const k = parse(p.k, null); if (!k || !r || k.r !== r.id) continue;
    seen.add(id); const v = viewOf(id, p.c || "#ccc", p.n || "Player"); follow(v, k, dt, now, false);
    placeCraft(v.g, v.f, v.u, v.a, k.s || 0, !!k.b, k.v || 0, tSec + id.length);
    if (k.b && Math.random() < 0.5) boostTrail(v.g);
  }
  const hostBots = isHost();
  for (const b of botList()) {
    seen.add(b.i); const v = viewOf(b.i, b.c, b.n); follow(v, b, dt, now, hostBots);
    placeCraft(v.g, v.f, v.u, v.a, b.s || 0, !!b.b, b.v || 0, tSec + b.i.charCodeAt(1));
    if (b.b && Math.random() < 0.5) boostTrail(v.g);
  }
  for (const [id, v] of views) if (!seen.has(id)) { scene.remove(v.g); views.delete(id); }
  // my craft
  if (!me.g) me.g = makeCraft(myColor, "");
  placeCraft(me.g, me.f, me.u, me.a, me.lean, me.boost > 0, me.v, tSec);
  if (me.boost > 0) boostTrail(me.g);
  padMat.map.offset.y -= dt * 1.5;
  railL.material.map.offset.y -= dt * 0.6;
  tickParts(dt);
  // chase camera: behind the nose, tilting with the banked road
  camA += angle(me.a * 0.6 - camA) * Math.min(1, dt * 5);
  frameAt(me.f);
  _f.copy(_t).multiplyScalar(Math.cos(camA)).addScaledVector(_l, Math.sin(camA)).normalize();
  const back = (ATTRACT ? 12 : camera.aspect < 1 ? 12.5 : 10) + clamp(me.v / CONFIG.vmax, 0, 1.5) * 1.5;
  camera.position.copy(me.g.position).addScaledVector(_f, -back).addScaledVector(_n, ATTRACT ? 5.5 : 3.8);
  me.shake = Math.max(0, me.shake - dt * 3);
  if (me.shake) camera.position.add(_w.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(me.shake * 0.8));
  camLook.copy(me.g.position).addScaledVector(_f, 9).addScaledVector(_n, 0.8);
  camUp.lerp(_w.copy(UP).lerp(_n, 0.5), Math.min(1, dt * 4)).normalize(); camera.up.copy(camUp);
  camera.lookAt(camLook);
  const fov = (camera.aspect < 1 ? 84 : 70) + (me.boost > 0 ? 12 : 0) + clamp(me.v / CONFIG.vmax, 0, 1) * 4;
  camera.fov += (fov - camera.fov) * Math.min(1, dt * 4); camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  if (r && now - lastHud > 100) { lastHud = now; hud(r, now); }
}
/** A puff of glowing dots out of a craft's thrusters. */
function boostTrail(g) {
  _w.set(0, 0.3, -2.6).applyQuaternion(g.quaternion).add(g.position);
  emit(_w, _x.set(0, 0, -6).applyQuaternion(g.quaternion), "#7ff9ff", 1, 3, 0.45);
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("again", () => again());
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...shared("bots", []).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { countdown: 1500, resultsFor: 1500, seats: 7 });
  started = performance.now();
  requestAnimationFrame(frame);
})();
</script>
